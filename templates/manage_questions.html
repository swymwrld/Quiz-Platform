{% extends "base.html" %}
{% block title %}Manage Questions - Quiz Platform{% endblock %}
{% block content %}
<div class="w-full max-w-5xl bg-gray-800 rounded-xl shadow-2xl p-8 border border-gray-700">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-3xl font-bold text-white">Manage Questions</h2>
        <a href="/admin" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-semibold transition">
            + Add Question
        </a>
    </div>
    
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-900 text-gray-400 text-sm uppercase tracking-wide border-b border-gray-700">
                    <th class="py-3 px-4">ID</th>
                    <th class="py-3 px-4">Question</th>
                    <th class="py-3 px-4">Answer</th>
                    <th class="py-3 px-4 text-center">Actions</th>
                </tr>
            </thead>
            <tbody class="text-gray-300 divide-y divide-gray-700">
                {% for q in questions %}
                <tr class="hover:bg-gray-750 transition">
                    <td class="py-3 px-4">{{ q[0] }}</td>
                    <td class="py-3 px-4 max-w-xs truncate">{{ q[1] }}</td>
                    <td class="py-3 px-4 text-green-400">{{ q[6] }}</td>
                    <td class="py-3 px-4 text-center space-x-2">
                        <a href="/edit_question/{{ q[0] }}" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-sm transition">Edit</a>
                        <a href="/delete_question/{{ q[0] }}" onclick="return confirm('Are you sure?')" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1 rounded text-sm transition">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
