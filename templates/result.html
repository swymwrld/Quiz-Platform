{% extends "base.html" %}
{% block title %}Result - Quiz Platform{% endblock %}
{% block content %}
<div class="w-full max-w-md bg-gray-800 rounded-xl shadow-2xl p-8 border border-gray-700 text-center">
    <h2 class="text-3xl font-bold text-white mb-4">Exam Finished!</h2>
    
    <div class="mb-6">
        <p class="text-gray-400 text-sm">Candidate</p>
        <p class="text-xl font-semibold text-white">{{ name }}</p>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="bg-gray-900 p-4 rounded-lg border border-gray-700">
            <p class="text-gray-400 text-sm">Score</p>
            <p class="text-3xl font-bold text-indigo-400">{{ score }}</p>
        </div>
        <div class="bg-gray-900 p-4 rounded-lg border border-gray-700">
            <p class="text-gray-400 text-sm">Percentage</p>
            <p class="text-3xl font-bold text-indigo-400">{{ percentage|round(1) }}%</p>
        </div>
    </div>

    <div class="py-4 px-6 rounded-lg font-bold text-2xl shadow-inner mb-6 
        {% if status == 'PASS' %}bg-green-500/20 text-green-400 border border-green-500/30
        {% else %}bg-red-500/20 text-red-400 border border-red-500/30{% endif %}">
        {{ status }}
    </div>

    <a href="/leaderboard" class="inline-block w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3 px-4 rounded-lg transition transform hover:scale-105 shadow-lg">
        View Leaderboard
    </a>
</div>
{% endblock %}
