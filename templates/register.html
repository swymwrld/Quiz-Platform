{% extends "base.html" %}
{% block title %}Register - Quiz Platform{% endblock %}
{% block content %}
<div class="w-full max-w-md bg-gray-800 rounded-xl shadow-2xl p-8 border border-gray-700 text-center">
    <h2 class="text-3xl font-bold text-white mb-6">Enter Details</h2>
    <form action="/instructions" method="POST" class="space-y-4">
        <div>
            <input type="text" name="name" placeholder="Full Name" required 
                   class="w-full px-4 py-3 bg-gray-900 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-700">
        </div>
        <div>
            <input type="email" name="email" placeholder="Email Address" required 
                   class="w-full px-4 py-3 bg-gray-900 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-700">
        </div>
        <button type="submit" 
                class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3 px-4 rounded-lg transition transform hover:scale-105 shadow-lg">
            Continue to Instructions
        </button>
    </form>
</div>
{% endblock %}
