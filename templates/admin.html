{% extends "base.html" %}
{% block title %}Admin Add Question - Quiz Platform{% endblock %}
{% block content %}
<div class="w-full max-w-2xl bg-gray-800 rounded-xl shadow-2xl p-8 border border-gray-700">
    <h2 class="text-3xl font-bold text-white mb-6 text-center">Add New Question</h2>
    
    <form action="/admin" method="POST" class="space-y-4">
        <div>
            <textarea name="question" placeholder="Question Text" required rows="3"
                      class="w-full px-4 py-3 bg-gray-900 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-700"></textarea>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" name="option1" placeholder="Option 1" required class="w-full px-4 py-3 bg-gray-900 text-white rounded-lg focus:outline-none border border-gray-700">
            <input type="text" name="option2" placeholder="Option 2" required class="w-full px-4 py-3 bg-gray-900 text-white rounded-lg focus:outline-none border border-gray-700">
            <input type="text" name="option3" placeholder="Option 3" required class="w-full px-4 py-3 bg-gray-900 text-white rounded-lg focus:outline-none border border-gray-700">
            <input type="text" name="option4" placeholder="Option 4" required class="w-full px-4 py-3 bg-gray-900 text-white rounded-lg focus:outline-none border border-gray-700">
        </div>

        <div>
            <input type="text" name="answer" placeholder="Correct Answer (Must match one option exactly)" required 
                   class="w-full px-4 py-3 bg-gray-900 text-green-400 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 border border-green-700">
        </div>

        <button type="submit" 
                class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3 px-4 rounded-lg transition transform hover:scale-105 shadow-lg mt-4">
            Add Question
        </button>
    </form>
</div>
{% endblock %}
