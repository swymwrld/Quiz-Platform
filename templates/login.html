{% extends "base.html" %}
{% block title %}Admin Login - Quiz Platform{% endblock %}
{% block content %}
<div class="w-full max-w-md bg-gray-800 rounded-xl shadow-2xl p-8 border border-gray-700 text-center">
    <h2 class="text-3xl font-bold text-white mb-6">Admin Login</h2>
    <form action="/login" method="POST" class="space-y-4">
        <div>
            <input type="text" name="username" placeholder="Username" required 
                   class="w-full px-4 py-3 bg-gray-900 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-700">
        </div>
        <div>
            <input type="password" name="password" placeholder="Password" required 
                   class="w-full px-4 py-3 bg-gray-900 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-700">
        </div>
        <button type="submit" 
                class="w-full bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-500 hover:to-pink-500 text-white font-bold py-3 px-4 rounded-lg transition transform hover:scale-105 shadow-lg">
            Login
        </button>
    </form>
</div>
{% endblock %}
