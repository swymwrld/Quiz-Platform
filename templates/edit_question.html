{% extends "base.html" %}
{% block title %}Edit Question - Quiz Platform{% endblock %}
{% block content %}
<div class="w-full max-w-2xl bg-gray-800 rounded-xl shadow-2xl p-8 border border-gray-700">
    <div class="flex items-center mb-6">
        <a href="/admin/questions" class="text-gray-400 hover:text-white mr-4">&larr; Back</a>
        <h2 class="text-3xl font-bold text-white">Edit Question #{{ q[0] }}</h2>
    </div>
    
    <form action="/edit_question/{{ q[0] }}" method="POST" class="space-y-4">
        <div>
            <textarea name="question" required rows="3"
                      class="w-full px-4 py-3 bg-gray-900 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-700">{{ q[1] }}</textarea>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" name="option1" value="{{ q[2] }}" required class="w-full px-4 py-3 bg-gray-900 text-white rounded-lg focus:outline-none border border-gray-700">
            <input type="text" name="option2" value="{{ q[3] }}" required class="w-full px-4 py-3 bg-gray-900 text-white rounded-lg focus:outline-none border border-gray-700">
            <input type="text" name="option3" value="{{ q[4] }}" required class="w-full px-4 py-3 bg-gray-900 text-white rounded-lg focus:outline-none border border-gray-700">
            <input type="text" name="option4" value="{{ q[5] }}" required class="w-full px-4 py-3 bg-gray-900 text-white rounded-lg focus:outline-none border border-gray-700">
        </div>

        <div>
            <label class="block text-gray-400 text-sm mb-1">Correct Answer</label>
            <input type="text" name="answer" value="{{ q[6] }}" required 
                   class="w-full px-4 py-3 bg-gray-900 text-green-400 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 border border-green-700">
        </div>

        <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition transform hover:scale-105 shadow-lg mt-4">
            Update Question
        </button>
    </form>
</div>
{% endblock %}
